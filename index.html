const BRIEFING_DATE='2026-11-25';
const selected=new Set();
let currentFilter='all';

function rl(r){return r===3?'★★★':r===2?'★★☆':'★☆☆';}

function render(){
  const list=document.getElementById('list');
  const sorted=[...DATA].sort((a,b)=>b.r-a.r);
  const filtered=currentFilter==='all'?sorted:sorted.filter(d=>d.r===currentFilter);
  list.innerHTML=filtered.map(d=>{
    const ch=selected.has(d.n);
    const link=d.u?`<a href="${d.u}" target="_blank" rel="noopener">${esc(d.t)}</a>`:esc(d.t);
    return `<div class="item${ch?' checked':''}" data-n="${d.n}" onclick="toggle(${d.n},event)">
      <input type="checkbox" ${ch?'checked':''} tabindex="-1">
      <div class="meta">
        <div class="title-row">
          <span class="rb r${d.r}">${rl(d.r)}</span>
          <span class="t">${link}</span>
          <span class="src">${esc(d.s)}</span>
        </div>
        <div class="summary">${esc(d.j)}</div>
      </div>
    </div>`;
  }).join('');
  updateCounts();
}

function esc(s){
  const d=document.createElement('div');d.textContent=s;return d.innerHTML;
}

function toggle(n,e){
  if(e&&e.target.tagName==='A')return;
  selected.has(n)?selected.delete(n):selected.add(n);
  render();
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>{
    b.classList.toggle('active',b.dataset.filter===String(f));
  });
  render();
}

function updateCounts(){
  const sc=selected.size;
  document.getElementById('sel-count').textContent=sc+' selected';
  const btn=document.getElementById('send-btn');
  btn.textContent=sc>0?`${sc}件を採用する`:'採用する';
  if(sc===0){
    btn.classList.add('disabled');
    btn.href='#';
  }else{
    btn.classList.remove('disabled');
    btn.href=buildIssueUrl();
  }
}

function selectAllVisible(){
  const sorted=[...DATA].sort((a,b)=>b.r-a.r);
  const filtered=currentFilter==='all'?sorted:sorted.filter(d=>d.r===currentFilter);
  filtered.forEach(d=>selected.add(d.n));
  render();
}

function deselectAll(){
  selected.clear();
  render();
}

function selectedNums(){
  return [...selected].sort((a,b)=>a-b).join(',');
}

function buildCommand(){
  return 'ブリーフィングから以下の項目を採用してNotion記事DBに登録してください: '+selectedNums();
}

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// GitHub Issue を開く（Actions が自動で記事登録＋ファクトチェックする）
function buildIssueUrl(){
  const nums=selectedNums();
  const titles=[...selected].sort((a,b)=>a-b).map(n=>{
    const d=DATA.find(x=>x.n===n);
    return d?`- ${n}: ${d.t}`:`- ${n}`;
  }).join('\n');
  const title=encodeURIComponent('briefing-selection: '+BRIEFING_DATE);
  const body=encodeURIComponent('numbers: '+nums+'\n\n'+titles+'\n\n<!-- このIssueを作成すると自動で記事登録+ファクトチェックが実行されます -->');
  const url=`https://github.com/musicalsokuhou/life/issues/new?title=${title}&body=${body}&labels=briefing-selection`;
  // iOSはUniversal LinksでGitHubアプリがリンクを横取りしてしまう（タイトル・本文が反映されない）ため、
  // x-safari- スキームでSafari自身に強制的に開かせてアプリの介入を回避する
  return isIOS()?'x-safari-'+url:url;
}

function onSendClick(e){
  if(selected.size===0){e.preventDefault();return false;}
  return true;
}

// フォールバック: Claude Code に貼り付ける用
function copySelection(){
  if(selected.size===0){showToast('項目を選択してください');return;}
  const cmd=buildCommand();
  navigator.clipboard.writeText(cmd).then(()=>{
    showToast('Copied! Claude Code に貼り付けてください');
  }).catch(()=>{
    prompt('以下をコピー:',cmd);
  });
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

render();
</script>
